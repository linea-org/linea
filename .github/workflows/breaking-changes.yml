name: Breaking changes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: breaking-changes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: Public API
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get the API description from main
        run: git show "origin/$GITHUB_BASE_REF:docs/openapi.json" > base.json

      # A change that has to break clients gets the label "breaking". Warnings count too: one of them
      # is a new value in a response, which an installed SDK refuses.
      - uses: oasdiff/oasdiff-action/breaking@14ca7009a63c417dfe27b7c44359c4bcccaf8eee # v0.2.1
        with:
          base: base.json
          revision: docs/openapi.json
          fail-on: WARN
          review: "false"
          github-token: ""
