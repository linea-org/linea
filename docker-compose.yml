services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: linea-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: linea
      POSTGRES_PASSWORD: linea
      POSTGRES_DB: linea
    volumes:
      - linea_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linea -d linea"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: linea-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - linea_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  linea_postgres_data:
  linea_redis_data:
